spring:
  application:
    name: friodiag
  config:
    import: optional:file:.env[.properties]   # lê o .env da raiz em dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/friodiag}
    username: ${DB_USER}
    password: ${DB_PASSWORD}          # sem valor padrão: segredo nunca no código
  jpa:
    hibernate:
      ddl-auto: validate              # quem cria tabela é o Flyway
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
friodiag:
  limite-diario: ${FRIODIAG_LIMITE_DIARIO:20}
